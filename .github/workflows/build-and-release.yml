name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-clients:
    name: Build Apple clients
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Build macOS release
        run: |
          xcodebuild \
            -project deepseek-harness-macos.xcodeproj \
            -scheme deepseek-harness-macos \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/macos-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package macOS app
        run: |
          APP="$RUNNER_TEMP/macos-derived/Build/Products/Release/DeepSeek Harness.app"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "$RUNNER_TEMP/Dsh-macUI-macOS.zip"

      - name: Build unsigned iOS release
        run: |
          xcodebuild \
            -project deepseek-harness-mobile.xcodeproj \
            -scheme deepseek-harness-mobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iOS IPA
        run: |
          APP="$RUNNER_TEMP/ios-derived/Build/Products/Release-iphoneos/DeepSeek Harness Mobile.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$APP" "$RUNNER_TEMP/Payload/DeepSeek Harness Mobile.app"
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc Payload Dsh-macUI-iOS-unsigned.ipa

      - name: Upload Apple packages
        uses: actions/upload-artifact@v4
        with:
          name: apple-clients
          path: |
            ${{ runner.temp }}/Dsh-macUI-macOS.zip
            ${{ runner.temp }}/Dsh-macUI-iOS-unsigned.ipa
          if-no-files-found: error

  relay-server:
    name: Test and package relay server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deepseek-harness-sync-server/package.json

      - name: Test relay server
        working-directory: deepseek-harness-sync-server
        run: npm test

      - name: Package relay server
        run: |
          tar \
            --exclude='node_modules' \
            --exclude='.DS_Store' \
            -czf "$RUNNER_TEMP/Dsh-macUI-relay-server.tar.gz" \
            deepseek-harness-sync-server

      - name: Upload relay package
        uses: actions/upload-artifact@v4
        with:
          name: relay-server
          path: ${{ runner.temp }}/Dsh-macUI-relay-server.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apple-clients, relay-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: shasum -a 256 release-assets/* > release-assets/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dsh-macUI $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "macOS 包使用临时签名；iOS IPA 未签名，需要使用你自己的证书重新签名后安装。"
